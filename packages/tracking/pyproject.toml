[project]
name = "gridiron-tracking"
version = "0.1.0"
description = "Footage to tracking data — detection, field registration, multi-object tracking in field coordinates"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "pydantic>=2.7"]

# Nothing above this line touches a pixel. The contract, the field geometry, the
# homography maths, the filters and the whole benchmark scorer run on a laptop
# with no CV stack at all — which is what lets the accuracy loop be developed and
# tested before a single frame of video has been downloaded.
[project.optional-dependencies]
video = ["opencv-python>=4.9"]
detect = ["ultralytics>=8.1"]
# Reading the field with a vision model, so registration stops being manual.
vision = ["anthropic>=1.0", "opencv-python>=4.9"]
# Benchmarking a video model against known tracking.
vlm = ["google-genai>=2.0"]
# A second and third reader for the same prompt. Not redundancy for its own sake: a
# busy endpoint at one provider failed every anchor frame of a clip, and the only
# fix for that is a reader somewhere else. Qwen-VL speaks the OpenAI wire protocol.
readers = ["google-genai>=2.0", "openai>=1.40"]
# Downloaded Qwen-VL, accelerated by Metal on Apple Silicon. No API key required.
local-vision = ["mlx-vlm==0.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'", "llguidance>=1.7,<2", "opencv-python>=4.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron_tracking*"]
