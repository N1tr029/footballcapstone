[project]
name = "gridiron-counterfactual"
version = "0.1.0"
description = "The what-if model — was there a better option on this play, and what was it worth"
requires-python = ">=3.11"
dependencies = ["gridiron-tracking", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14",
                "scikit-learn>=1.4", "joblib>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridiron_counterfactual*"]
