# One suite, two packages, and neither is installed during development.
#
# `pythonpath` is what makes `import gridiron_tracking` and
# `import gridiron_counterfactual` work from a bare checkout, so the test files
# do not have to repair sys.path themselves. Each package's tests/conftest.py
# still does the same inserts, so running one package's suite on its own —
# `pytest packages/tracking/tests` from anywhere — keeps working.
#
# The shared helpers in each tests/ directory are named distinctly
# (tracking_support, cf_support) rather than being reached through `conftest`.
# Two directories both called tests/, both with a conftest.py, both doing
# `from conftest import ...` resolve to whichever landed on sys.path first: each
# suite passes alone and the pair fails on import. Distinct names, no ambiguity.
[pytest]
testpaths = packages/tracking/tests packages/counterfactual/tests apps/api/tests
pythonpath = packages/tracking packages/counterfactual apps/api
